<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>جهت لوکس — دفتر حساب مشترک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050608; --elev:#111317; --elev2:#181b22;
    --ink:#F3EFE6; --muted:#A6A195; --muted2:#7C786E;
    --gold:#D4B87A; --gold-bright:#E6CD9C; --gold-deep:#9C7D3F;
    --emerald:#4AD9A3; --emerald-dim:rgba(74,217,163,.14);
    --wine:#D16D66; --wine-dim:rgba(209,109,102,.16);
    --hair:rgba(255,255,255,.10); --hair2:rgba(255,255,255,.18);
    --stage:#EAE7E0; --stage-ink:#2B2A26;
    --glass:rgba(17,19,23,0.7);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--stage);font-family:'Vazirmatn',sans-serif;padding:36px 16px 80px;}
  .intro{max-width:480px;margin:0 auto 36px;text-align:center;}
  .intro h1{font-size:22px;font-weight:900;color:var(--stage-ink);letter-spacing:-0.5px;}
  .intro p{font-size:14px;color:#75726A;margin-top:12px;line-height:1.9;font-weight:500;}
  .strip{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .chip{display:flex;align-items:center;gap:6px;font-size:12px;color:#75726A;background:#fff;border:1px solid #DEDAD0;padding:6px 12px;border-radius:999px;font-weight:600;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  .stage-wrap{display:flex;justify-content:center;}
  .phone{width:398px;background:#0a0a0a;border-radius:52px;padding:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5),0 15px 30px -10px rgba(0,0,0,.35); border: 4px solid #1c1c1c;}
  .screen{position:relative;width:100%;height:774px;background:var(--bg);border-radius:36px;overflow:hidden;}
  .glow-top{position:absolute;width:340px;height:340px;top:-100px;right:-100px;background:radial-gradient(circle,rgba(212,184,122,.28),transparent 72%);filter:blur(10px);pointer-events:none;z-index:0; opacity: 0.7;}
  .glow-bottom{position:absolute;width:240px;height:240px;bottom:-60px;left:-60px;background:radial-gradient(circle,rgba(74,217,163,.24),transparent 72%);filter:blur(8px);pointer-events:none;z-index:0; opacity: 0.6;}

  .content{position:absolute;inset:0;top:26px;bottom:100px;overflow-y:auto;padding:0 20px; scrollbar-width: none;}
  .content::-webkit-scrollbar{display:none;}

  .view{display:none;flex-direction:column;gap:26px;padding-bottom:20px;}
  .view.visible{display:flex;}

  /* ---- Hero statement card ---- */
  .hero{position:relative;background:var(--glass); backdrop-filter: blur(20px); border:1px solid var(--hair);border-radius:24px;padding:24px 22px 20px;overflow:hidden;opacity:0;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) .1s forwards;z-index:1; box-shadow: 0 20px 40px -15px rgba(0,0,0,.3);}
  .hero::before{ content: ''; position: absolute; inset: -1px; border-radius: 24px; padding: 1px; background: linear-gradient(135deg, var(--gold-bright), transparent, var(--gold-deep)); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0.4;}

  .hero-sheen{position:absolute;top:0;left:0;width:70%;height:100%;background:linear-gradient(125deg,transparent 30%,rgba(255,255,255,.09) 45%,rgba(230,205,156,.30) 50%,transparent 65%);transform:translateX(-150%) skewX(-18deg);animation:sheen 2.2s ease-in-out 1.2s forwards;pointer-events:none;}
  .hero-sheen.replay{animation:sheen 1.8s ease-in-out forwards;}

  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1;}
  .eyebrow{font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:1.8px;text-transform: uppercase;}
  .htitle{font-size:26px;font-weight:900;color:var(--ink);margin-top:5px; letter-spacing: -0.5px;}
  .ring-avatar{width:42px;height:42px;border-radius:50%;border:2px solid rgba(212,184,122,.65);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--gold-bright);flex-shrink:0; background: radial-gradient(circle at center, rgba(212,184,122,.25), transparent); box-shadow: 0 5px 15px -5px rgba(212,184,122,.3);}
  .gold-rule{width:48px;height:2.5px;margin-top:18px;border-radius:2px;background:linear-gradient(90deg,var(--gold-bright),var(--gold-deep));position:relative;z-index:1;}
  .net-lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-top:20px;position:relative;z-index:1;}
  .net-row{display:flex;align-items:baseline;gap:8px;margin-top:8px;position:relative;z-index:1;}
  .net-num{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:900;color:var(--ink);direction:ltr;font-variant-numeric:tabular-nums; letter-spacing: -1px;}
  .net-unit{font-size:14px;color:var(--muted2);font-weight:600;}
  .hair-full{height:1.5px;background:var(--hair);margin-top:20px;position:relative;z-index:1;}
  .split{display:flex;position:relative;z-index:1;margin-top:18px;}
  .split-col{flex:1;}
  .split-div{width:1.5px;background:var(--hair);margin:0 18px;}
  .split-lbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600;}
  .split-num{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:800;margin-top:8px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;}
  .split-num.g{color:var(--emerald);} .split-num.w{color:var(--wine);}

  /* ---- Quick actions ---- */
  .qa-row{display:flex;gap:14px;opacity:0;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) .6s forwards;}
  .qa-btn{flex:1;display:flex;flex-direction: column; align-items:center;justify-content:center;gap:10px;padding:18px 10px;border-radius:20px;background:var(--elev);border:1px solid var(--hair);color:var(--ink);font-family:'Vazirmatn';font-size:14px;font-weight:800;cursor:pointer;transition:all .3s cubic-bezier(.2,.7,.2,1); box-shadow: 0 10px 25px -10px rgba(0,0,0,.2);}
  .qa-btn:hover{border-color:var(--gold);background:rgba(212,184,122,.10); transform: translateY(-3px); box-shadow: 0 15px 30px -10px rgba(212,184,122,.2);}
  .qa-btn svg{width:24px;height:24px;color:var(--gold);}

  /* ---- Section list ---- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;}
  .sec-title{font-size:16px;font-weight:900;color:var(--ink); letter-spacing: -0.3px;}
  .sec-link{font-size:13px;font-weight:800;color:var(--gold);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px; transition: opacity .2s;}
  .sec-link:hover{ opacity: 0.8; }
  .sec-link svg{width:14px;height:14px;}

  .list{background:var(--elev);border:1px solid var(--hair);border-radius:22px;overflow:hidden; box-shadow: 0 15px 35px -15px rgba(0,0,0,.25);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--hair);cursor:pointer;opacity:0;animation:rowIn .6s cubic-bezier(.2,.7,.2,1) forwards;transition:background .25s,transform .25s;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--elev2);transform:translateX(-4px);}
  .who{display:flex;align-items:center;gap:14px;}
  .ini{width:44px;height:44px;border-radius:14px;border:1px solid rgba(212,184,122,.5);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--gold-bright);flex-shrink:0; background: radial-gradient(circle at center, rgba(212,184,122,.15), transparent);}
  .ini.settled{animation:pulseRing 3s ease-in-out infinite; background: rgba(74,217,163,.1); border-color: rgba(74,217,163,.3); color: var(--emerald);}
  .rname{font-size:15px;font-weight:800;color:var(--ink);}
  .rsub{font-size:12px;color:var(--muted);margin-top:4px; font-weight: 500;}
